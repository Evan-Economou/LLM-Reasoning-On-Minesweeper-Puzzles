[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minesweeper-llm-project"
version = "0.1.0"
description = "Deterministic Minesweeper engine for LLM reasoning experiments"
requires-python = ">=3.10"
dependencies = [
	"torch>=2.2",
]

[project.optional-dependencies]
llm = [
	"anthropic>=0.45",
]
pygame = [
	"pygame>=2.5",
]
viz = [
	"matplotlib>=3.8",
	"pandas>=2.0",
	"numpy>=1.26",
	"seaborn>=0.13",
	"scipy>=1.12",
]
all = [
	"anthropic>=0.45",
	"pygame>=2.5",
	"matplotlib>=3.8",
	"pandas>=2.0",
	"numpy>=1.26",
	"seaborn>=0.13",
	"scipy>=1.12",
]

[tool.setuptools]
packages = ["minesweeper", "llm_runner"]
